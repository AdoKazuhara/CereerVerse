<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerVerse 3D - Civil Engineer: Bridge Stress Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; overflow: hidden; height: 100vh; }
    
    /* 3D Canvas Viewport */
    #canvas-container { width: 100vw; height: 100vh; display: block; }

    /* UI Overlay Header */
    #ui-header {
      position: absolute; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .badge {
      background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
      border: 1px solid #334155; padding: 8px 16px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 600; color: #38bdf8; letter-spacing: 0.5px;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      border: 1px solid #334155; border-radius: 12px; padding: 12px 20px;
      color: #fff; pointer-events: auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    /* Controls Panel */
    #ui-bottom {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; pointer-events: auto;
    }
    .btn {
      background: #2563eb; color: #fff; border: none; padding: 12px 24px;
      border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn:hover { background: #1d4ed8; transform: translateY(-2px); }
    .btn-secondary { background: #475569; box-shadow: none; }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: #16a34a; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
    .btn-success:hover { background: #15803d; }

    /* Modal Popup for Results */
    #result-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
      justify-content: center; align-items: center; z-index: 10;
    }
    .modal-content {
      background: #1e293b; border: 1px solid #475569; border-radius: 16px;
      padding: 32px; width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .stars { font-size: 2rem; color: #f59e0b; margin: 12px 0; }
    .score-tag { font-size: 1.1rem; color: #94a3b8; margin-bottom: 20px; }
    .riasec-box {
      background: #0f172a; padding: 16px; border-radius: 8px; border-left: 4px solid #38bdf8;
      text-align: left; margin-bottom: 24px; font-size: 0.9rem; color: #cbd5e1;
    }
  </style>

  <!-- Import Three.js library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-header">
    <div>
      <div class="badge">REALISTIC ISLAND</div>
      <h2 style="margin-top: 4px; font-size: 1.4rem;">Civil Engineer: Bridge Stress Test</h2>
    </div>
    <div class="hud-card">
      <div style="font-size: 0.75rem; color: #94a3b8; text-transform: uppercase;">Support Beams Placed</div>
      <div style="font-size: 1.25rem; font-weight: 700; color: #38bdf8;" id="beam-count">0 / 3 Required</div>
    </div>
  </div>

  <div id="ui-bottom">
    <button class="btn" id="btn-add" onclick="addBeam()">+ Add Support Beam</button>
    <button class="btn btn-secondary" onclick="resetBridge()">Reset</button>
    <button class="btn btn-success" id="btn-test" onclick="runStressTest()">Run Vehicle Test</button>
  </div>

  <!-- Results Modal -->
  <div id="result-modal">
    <div class="modal-content">
      <h2 id="modal-title" style="color: #38bdf8;">Bridge Assessment Complete!</h2>
      <div class="stars" id="star-rating">★ ★ ★ ★ ★</div>
      <div class="score-tag" id="score-text">Structural Integrity Score: 100%</div>
      <div class="riasec-box">
        <strong>RIASEC Score Update:</strong><br>
        <span id="riasec-desc">+25 Realistic (R) Points added to profile. High aptitude for structural logic and spatial problem-solving.</span>
      </div>
      <button class="btn" style="width: 100%;" onclick="closeModal()">Continue Exploring</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- THREE.JS SCENE SETUP ---
    let scene, camera, renderer;
    let beams = [];
    let truck, canyonLeft, canyonRight;
    let isTesting = false;
    let truckProgress = 0;
    const maxBeams = 3;

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene & Camera
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 22);
      camera.lookAt(0, 0, 0);

      // 2. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // 3. Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 4. Build Environment (Canyon & Road Deck)
      createEnvironment();

      // 5. Build Dynamic Vehicle
      createTruck();

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      
      animate();
    }

    // --- ENVIRONMENT & OBJECT GENERATION ---
    function createEnvironment() {
      const rockMaterial = new THREE.MeshLambertMaterial({ color: 0x334155 });
      const deckMaterial = new THREE.MeshLambertMaterial({ color: 0x475569 });

      // Left Cliff
      canyonLeft = new THREE.Mesh(new THREE.BoxGeometry(8, 10, 6), rockMaterial);
      canyonLeft.position.set(-9, -5, 0);
      scene.add(canyonLeft);

      // Right Cliff
      canyonRight = new THREE.Mesh(new THREE.BoxGeometry(8, 10, 6), rockMaterial);
      canyonRight.position.set(9, -5, 0);
      scene.add(canyonRight);

      // Main Road Deck Span
      const roadDeck = new THREE.Mesh(new THREE.BoxGeometry(12, 0.4, 4), deckMaterial);
      roadDeck.position.set(0, 0, 0);
      scene.add(roadDeck);
    }

    function createTruck() {
      truck = new THREE.Group();

      // Cab & Body
      const bodyGeo = new THREE.BoxGeometry(2, 1.2, 1.4);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.8;
      truck.add(body);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16);
      const wheelMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
      wheelGeo.rotateX(Math.PI / 2);

      const positions = [[-0.6, 0.3, 0.7], [0.6, 0.3, 0.7], [-0.6, 0.3, -0.7], [0.6, 0.3, -0.7]];
      positions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...pos);
        truck.add(wheel);
      });

      truck.position.set(-11, 0, 0);
      scene.add(truck);
    }

    // --- INTERACTIVE GAMEPLAY MECHANICS ---
    function addBeam() {
      if (beams.length >= maxBeams || isTesting) return;

      const beamMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8 });
      const beamGeo = new THREE.CylinderGeometry(0.15, 0.15, 7.5);
      const beam = new THREE.Mesh(beamGeo, beamMat);

      // Angle and position support beams under bridge deck
      if (beams.length === 0) {
        beam.position.set(-3, -2.2, 0);
        beam.rotation.z = Math.PI / 4;
      } else if (beams.length === 1) {
        beam.position.set(3, -2.2, 0);
        beam.rotation.z = -Math.PI / 4;
      } else if (beams.length === 2) {
        beam.position.set(0, -2.8, 0);
        beam.rotation.z = 0;
      }

      scene.add(beam);
      beams.push(beam);
      document.getElementById('beam-count').innerText = `${beams.length} / ${maxBeams} Required`;
    }

    function resetBridge() {
      if (isTesting) return;
      beams.forEach(b => scene.remove(b));
      beams = [];
      truck.position.set(-11, 0, 0);
      truck.rotation.z = 0;
      truckProgress = 0;
      document.getElementById('beam-count').innerText = `0 / ${maxBeams} Required`;
    }

    function runStressTest() {
      if (isTesting) return;
      isTesting = true;
      truckProgress = 0;
      truck.position.set(-11, 0, 0);
      truck.rotation.z = 0;
    }

    // --- ANIMATION & SIMULATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotate camera gently when idling
      if (!isTesting) {
        camera.position.x = Math.sin(Date.now() * 0.0003) * 2;
        camera.lookAt(0, -1, 0);
      }

      // Truck stress test simulation logic
      if (isTesting) {
        truckProgress += 0.08;
        truck.position.x = -11 + truckProgress;

        // Bridge Failure Trigger (If fewer than 3 beams are placed)
        if (beams.length < maxBeams && truck.position.x >= -1) {
          // Trigger Collapse
          truck.position.y -= 0.15;
          truck.rotation.z -= 0.05;

          if (truck.position.y < -8) {
            isTesting = false;
            showResults(false);
          }
        } 
        // Successful Bridge Crossing
        else if (truck.position.x >= 11) {
          isTesting = false;
          showResults(true);
        }
      }

      renderer.render(scene, camera);
    }

    // --- RESULTS & RIASEC SCORE EVALUATION ---
    function showResults(success) {
      const modal = document.getElementById('result-modal');
      const title = document.getElementById('modal-title');
      const stars = document.getElementById('star-rating');
      const scoreText = document.getElementById('score-text');
      const riasecDesc = document.getElementById('riasec-desc');

      if (success) {
        title.innerText = "Bridge Stress Test Passed!";
        title.style.color = "#4ade80";
        stars.innerText = "★ ★ ★ ★ ★";
        scoreText.innerText = "Structural Integrity Score: 100%";
        riasecDesc.innerHTML = "<strong>+30 Realistic (R) Points</strong> added to your RIASEC Profile. Excellent mechanical aptitude and load-bearing logic!";
      } else {
        title.innerText = "Structural Failure!";
        title.style.color = "#f87171";
        stars.innerText = "★ ★ ☆ ☆ ☆";
        scoreText.innerText = "Structural Integrity Score: 30%";
        riasecDesc.innerHTML = "<strong>+10 Realistic (R) Points</strong> added. Reinforce all load distribution points with support beams before testing heavy vehicles.";
      }

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById('result-modal').style.display = "none";
      resetBridge();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Start scene on page load
    window.onload = init;
  </script>
</body>
</html>
